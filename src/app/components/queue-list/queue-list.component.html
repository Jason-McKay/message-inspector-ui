<div class="container mt-4">
  <h2>Queues</h2>

  <section>
    <div *ngIf="loading" class="text-muted my-2">
      <span class="spinner-border spinner-border-sm me-2" role="status"></span>Loading queues…
    </div>
    <div *ngIf="error" class="alert alert-danger">{{ error }}</div>
    <div *ngIf="!loading && !error && queueNamesJolokia.length === 0" class="alert alert-info">
      No queues found.
    </div>
    <div class="card" *ngIf="!loading && queueNamesJolokia.length">
      <div class="table-responsive">
        <table class="table table-striped mb-0">
          <thead>
          <tr>
            <th>Queue Name</th>
          </tr>
          </thead>
          <tbody>
          <tr *ngFor="let queue of queueNamesJolokia">
            <td>{{ queue }}</td>
          </tr>
          </tbody>
        </table>
      </div>
    </div>
  </section>
</div>
