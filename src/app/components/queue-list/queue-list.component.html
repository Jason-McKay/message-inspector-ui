<div class="container mt-4">
  <h2>Queues</h2>

  <section>
    @if (loading) {
      <div class="text-muted my-2">
        <span class="spinner-border spinner-border-sm me-2" role="status"></span>Loading queues…
      </div>
    }
    @if (error) {
      <div class="alert alert-danger">{{ error }}</div>
    }
    @if (!loading && !error && queueNamesJolokia.length === 0) {
      <div class="alert alert-info">
        No queues found.
      </div>
    }
    @if (!loading && queueNamesJolokia.length) {
      <div class="card">
        <div class="table-responsive">
          <table class="table table-striped mb-0">
            <thead>
            <tr>
              <th>Queue Name</th>
            </tr>
            </thead>
            <tbody>
            @for (queue of queueNamesJolokia; track queue) {
              <tr>
                <td>{{ queue }}</td>
              </tr>
            }
            </tbody>
          </table>
        </div>
      </div>
    }
  </section>
</div>
