<!-- No layout wrapper of its own: the component is a form fragment and takes the width and
     spacing of whatever card or column it is mounted in. -->
<div class="mb-3">
  <label for="queueSelect" class="form-label">Select a queue:</label>
  <select
    id="queueSelect"
    class="form-select"
    [disabled]="isLoading"
    [(ngModel)]="selectedQueue"
    (ngModelChange)="onQueueSelect($event)">
    @if (isLoading) {
      <option [ngValue]="null" disabled>Loading queues…</option>
    }
    @for (queue of queues; track queue) {
      <option [value]="queue">
        {{ queue }}
      </option>
    }
  </select>
  @if (!isLoading && queues.length === 0) {
    <div class="form-text text-muted">
      No queues available
    </div>
  }
</div>
