<div *ngIf="isLoading" class="text-center my-4">
  <div class="spinner-border text-primary" role="status">
    <span class="visually-hidden">Loading message…</span>
  </div>
</div>

<!-- A failed load used to be a blank page: the whole view is gated on message. -->
<div class="container mt-4" *ngIf="!isLoading && loadError">
  <div class="alert alert-danger">{{ loadError }}</div>
  <button class="btn btn-secondary" (click)="goBack()">← Back to List</button>
</div>

<div class="container mt-4" *ngIf="message">
  <h3>Message Detail</h3>
  <p><strong>Message ID:</strong> {{ message.messageId }}</p>
  <p><strong>Timestamp:</strong> {{ message.timestamp | date: 'medium' }}</p>
  <p><strong>Properties:</strong></p>
  <pre class="details">{{ message.properties | json }}</pre>

  <p><strong>Payload:</strong></p>
  <pre *ngIf="message.payload" class="payload">{{ message.payload | prettyPayload }}</pre>
  <p *ngIf="!message.payload" class="text-muted fst-italic">No payload</p>

  <div class="mt-4 d-flex gap-2">
    <button
      class="btn btn-success"
      [disabled]="loading.resend"
      (click)="showResendConfirm()"
    >
      <span *ngIf="loading.resend" class="spinner-border spinner-border-sm me-2"></span>
      Resend
    </button>

    <button
      class="btn btn-danger"
      [disabled]="loading.delete"
      (click)="showDeleteConfirm()"
    >
      <span *ngIf="loading.delete" class="spinner-border spinner-border-sm me-2"></span>
      Delete
    </button>

    <button
      class="btn btn-warning"
      [disabled]="loading.dlq"
      (click)="showDLQConfirm()"
    >
      <span *ngIf="loading.dlq" class="spinner-border spinner-border-sm me-2"></span>
      Move to DLQ
    </button>

    <button class="btn btn-secondary ms-auto" (click)="goBack()">
      ← Back to List
    </button>
  </div>
</div>

<!-- Confirmation Modal -->
<app-confirmation-modal
  [visible]="confirm.visible"
  [actionLabel]="confirm.action"
  (confirm)="confirm.handler?.()"
  (cancel)="confirm.visible = false">
</app-confirmation-modal>
